name: "Terraform Apply & Drift Detection"

on:
  push:
    branches:
      - main
    paths:
      - "envs/**"
      - ".github/workflows/**"
  # Le declencheur nocturne cron est commente en contexte AWS Academy Learner Lab :
  # les tokens de session temporaires (AWS_SESSION_TOKEN) expirent au bout de 4h quand le lab s eteint.
  # La detection de derive se declenche a la demande via workflow_dispatch ou terraform plan -detailed-exitcode.
  # schedule:
  #   - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  apply-dev:
    name: "Apply DEV Environment"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: "Terraform Init"
        run: terraform init -input=false

      - name: "Prepare tfvars from example"
        run: cp terraform.tfvars.example terraform.tfvars

      - name: "Terraform Plan"
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: terraform plan -input=false -out=tfplan

      - name: "Terraform Apply"
        run: terraform apply -auto-approve tfplan

  apply-prod:
    name: "Apply PROD Environment (Protected)"
    needs: apply-dev
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Environnement GitHub protege par approbation manuelle obligatoire
    environment:
      name: prod
    defaults:
      run:
        working-directory: envs/prod

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: "Terraform Init"
        run: terraform init -input=false

      - name: "Prepare tfvars from example"
        run: cp terraform.tfvars.example terraform.tfvars

      - name: "Terraform Plan"
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD_PROD }}
        run: terraform plan -input=false -out=tfplan

      - name: "Terraform Apply"
        run: terraform apply -auto-approve tfplan

  drift-check:
    name: "Drift Detection (plan -detailed-exitcode)"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env_dir: [envs/dev, envs/prod]

    defaults:
      run:
        working-directory: ${{ matrix.env_dir }}

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: "Terraform Init"
        run: terraform init -input=false

      - name: "Prepare tfvars from example"
        run: cp terraform.tfvars.example terraform.tfvars

      - name: "Check Drift"
        env:
          TF_VAR_db_password: ${{ matrix.env_dir == 'envs/prod' && secrets.TF_VAR_DB_PASSWORD_PROD || secrets.TF_VAR_DB_PASSWORD }}
        run: |
          set +e
          # 0 = conforme, 2 = derive detectee (le job echoue pour alerter), autre = erreur
          terraform plan -input=false -detailed-exitcode -no-color
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "Aucune derive detectee : le cloud est parfaitement synchrone avec le code."
            exit 0
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "::error::Derive detectee dans ${{ matrix.env_dir }} : l'infrastructure reelle ne correspond plus au code."
            exit 2
          else
            echo "::error::Erreur lors de l execution de terraform plan."
            exit $EXIT_CODE
          fi
